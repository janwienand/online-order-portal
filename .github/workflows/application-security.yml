# Everything visible in the Actions tab is named after what it does, not after the
# tool that does it. Product names live in the secrets and in the documentation.

name: Application security

# Pull requests only ever run the component check, and only when a dependency
# actually changed. Source code analysis runs on main and on demand, never on a
# pull request: this repository carries a batch of automated remediation PRs, and
# a full source scan on each of them would be slow, noisy and pointless.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - pom.xml
  workflow_dispatch:

permissions:
  # write, not read: the dependency-graph submission step needs it to publish
  # the open-source SBOM.
  contents: write
  security-events: write
  pull-requests: write
  actions: write

jobs:

  static-analysis:
    name: Static code analysis
    runs-on: ubuntu-latest
    # Never on a pull request. See the trigger comment above.
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up the build environment
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # One step: package the source, submit it, wait for the result, evaluate the
      # policy and publish the findings into the Security tab. The analysis engine
      # is the same one a developer can run locally before pushing.
      - name: Analyse the source code and publish findings
        uses: fortify/github-action@v3
        env:
          # Public regional endpoint, not a secret.
          FOD_URL: https://api.eu.fortify.com
          FOD_TENANT: ${{ secrets.FOD_TENANT }}
          FOD_USER: ${{ secrets.FOD_USER }}
          FOD_PASSWORD: ${{ secrets.FOD_PAT }}
          FOD_RELEASE: ${{ vars.FOD_RELEASE }}
          # Re-apply scan settings on every run and force the override, since
          # setup is otherwise skipped once a release already has settings.
          DO_SETUP: "true"
          OVERRIDE_SAST_SETTINGS: "true"
          # Technology stack and language level are intentionally left unset,
          # so setup falls back to Auto Detect, matching the release's manual
          # FoD configuration.
          # Open source is analysed here too, in parallel with the dedicated
          # engine in the job below, so the two result sets can be compared.
          DO_SCA_SCAN: "true"
          DO_AVIATOR_AUDIT: "true"
          PACKAGE_EXTRA_OPTS: -bt mvn
          DO_CHECK_POLICY: "true"

      # The SARIF export above only ever carries SAST findings - that's a hard
      # limit of the SARIF format, not a setting. To get the open-source result
      # set into the same Security tab, publish it through the dependency graph
      # instead: download the completed open-source analysis as an SBOM and hand
      # it to GitHub's own vulnerability matching (Dependabot alerts).
      - name: Set up the Fortify CLI for the following steps
        uses: fortify/github-action/setup@v3
        with:
          fcli: latest

      - name: Download the open-source analysis as an SBOM
        env:
          FOD_URL: https://api.eu.fortify.com
          FOD_TENANT: ${{ secrets.FOD_TENANT }}
          FOD_USER: ${{ secrets.FOD_USER }}
          FOD_PASSWORD: ${{ secrets.FOD_PAT }}
          FOD_RELEASE: ${{ vars.FOD_RELEASE }}
        run: |
          fcli fod session login --url "$FOD_URL" -t "$FOD_TENANT" -u "$FOD_USER" -p "$FOD_PASSWORD"
          fcli fod oss-scan download-latest --release "$FOD_RELEASE" --format SPDX --file fod-oss-sbom.spdx.json
          fcli fod session logout

      - name: Publish open-source findings to the dependency graph
        uses: advanced-security/spdx-dependency-submission-action@v0
        with:
          filePath: "."

  open-source-analysis:
    name: Open source analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up the build environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install the analysis tooling
        run: |
          curl -LsS https://github.com/debricked/cli/releases/download/release-v2/cli_linux_x86_64.tar.gz \
            | tar -xz debricked
          sudo mv debricked /usr/local/bin/debricked
          debricked --version

      - name: Resolve the dependency tree
        run: debricked resolve

      - name: Evaluate components against policy
        env:
          DEBRICKED_TOKEN: ${{ secrets.DEBRICKED_TOKEN }}
        run: |
          if [ -z "$DEBRICKED_TOKEN" ]; then
            echo "::error::No analysis credentials configured for this repository."
            exit 1
          fi
          debricked scan -t "$DEBRICKED_TOKEN"

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    needs: [static-analysis, open-source-analysis]
    if: always()
    steps:
      - name: Decide whether this release may proceed
        run: |
          CODE="${{ needs.static-analysis.result }}"
          DEPS="${{ needs.open-source-analysis.result }}"
          echo "Source code analysis ..... $CODE"
          echo "Open source analysis ..... $DEPS"
          # "skipped" is a valid outcome: on a pull request only the component
          # check runs, and that check alone decides the gate.
          for r in "$CODE" "$DEPS"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A security check did not pass. This build is blocked."; exit 1 ;;
            esac
          done
          echo "Every check that ran passed. This build may proceed."
