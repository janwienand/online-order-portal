name: Feature request
description: Propose a new feature or improvement
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What
      description: What should be built, at a high level?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: How do we know this is done?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this feature explicitly does not cover
    validations:
      required: false
